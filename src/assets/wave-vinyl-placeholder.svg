<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-labelledby="t d">
<title id="t">Whidbey Island DJ Collective — placeholder mark</title>
<desc id="d">A vinyl record whose grooves are rolling waves, the Whidbey Island coastline on the label, and an orca fluke cresting from the outer waves. Spins slowly; still under prefers-reduced-motion.</desc>
<style>.spin{transform-origin:200px 200px;animation:spin 10s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}@media (prefers-reduced-motion:reduce){.spin{animation:none}}</style>
